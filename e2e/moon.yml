# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'application'
language: 'typescript'

tasks:
  # Full end-to-end. Named `e2e` (not `test`) so `moon run :test` stays fast;
  # run explicitly with `moon run :e2e`. Builds the extension panel first.
  e2e:
    command: 'pnpm exec playwright test'
    # extension:build-fresh, not extension:build: a cached build can silently
    # serve a stale/dev-mode .output dirtied by `extension:dev` (moon trusts
    # existing output on a cache hit without re-verifying it) — see
    # apps/extension/moon.yml. E2E needs a guaranteed-real build every time.
    deps: ['extension:build-fresh', 'backend:build']
    options:
      cache: false
